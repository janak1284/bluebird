# testable_workloads.yaml
# Distributed Multi-Node Microservices (Testing Remote Worker Node Access)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-critical-01
  namespace: default
  labels:
    app: checkout-app
    workload-class: latency-critical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-app
  template:
    metadata:
      labels:
        app: checkout-app
        workload-class: latency-critical
    spec:
      nodeName: fedora  # Pinned to Fedora (Edge Node 1)
      containers:
      - name: checkout-api
        image: python:3.11-slim
        command:
        - python3
        - -c
        - |
          import json, os, time
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
                  res = {
                      "status": "Order Placed Successfully",
                      "service": "checkout-critical-01",
                      "sla_ms": 20,
                      "class": "latency-critical",
                      "served_by_node": os.environ.get("MY_NODE", "fedora"),
                      "timestamp": int(time.time())
                  }
                  self.wfile.write(json.dumps(res, indent=2).encode('utf-8'))
              def log_message(self, format, *args): pass
          HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
        env:
        - name: MY_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 8080
---
