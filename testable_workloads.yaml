  selector:
    matchLabels:
      app: analytics-app
  template:
    metadata:
      labels:
        app: analytics-app
        workload-class: batch-analytics
    spec:
      nodeName: archlinux  # Pinned to Arch Linux (Core Node 1)
      containers:
      - name: analytics-api
        image: python:3.11-slim
        command:
        - python3
        - -c
        - |
          import json, os, time
          from http.server import HTTPServer, BaseHTTPRequestHandler
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
                  res = {
                      "status": "Analytics Job Computed",
                      "service": "analytics-batch-01",
                      "sla_ms": 500,
                      "class": "batch-analytics",
                      "served_by_node": os.environ.get("MY_NODE", "archlinux"),
                      "timestamp": int(time.time())
                  }
                  self.wfile.write(json.dumps(res, indent=2).encode('utf-8'))
              def log_message(self, format, *args): pass
          HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
        env:
        - name: MY_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 8080
---
# Direct Raw IP NodePort Services (Ports 30081, 30082, 30083)
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: checkout-app
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: user-profile-app
  ports:
